<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1315">
  <meta name="description" content="BREAKLINE POOL Physics Lab 0.1 — nezávislý biliardový 3D prototyp">
  <title>BREAKLINE POOL — Physics Lab 0.1</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><div class="brand-ball">8</div><div><strong>BREAKLINE <em>POOL</em></strong><small>PHYSICS LAB · 0.1</small></div></div>
      <div class="topright"><span class="local"><span class="dot"></span> OFFLINE MATCH</span><button id="fullscreen" class="icon" title="Celá obrazovka" aria-label="Celá obrazovka">⛶</button></div>
    </header>
    <div class="toolbar">
      <div class="tags"><span>8-BALL</span><span>TRÉNING</span><span>3D PROTOTYP</span></div>
      <div class="toolbar-buttons">
        <button id="camera" class="minor">3D POHĽAD</button>
        <button id="rack" class="minor">↻ NOVÝ ROZSTREL</button>
      </div>
    </div>
    <main>
      <section class="stage" aria-label="3D biliardový stôl">
        <canvas id="game" tabindex="0" aria-label="Biliardový stôl — kliknutím zmeň smer úderu"></canvas>
        <div class="scene-note"><span id="status">Pripravený na rozstrel</span><span class="hint">Klikni na plátno a nastav smer.</span></div>
        <div class="pill">POHĽAD: <span id="viewLabel">Z HORA</span></div>
      </section>
    </main>
    <section class="controls">
      <div class="control-section narrow">
        <label class="label">JEMNÉ MIERENIE</label>
        <div class="aim"><button id="minus" aria-label="Vľavo o 0,25 stupňa">−</button><span>0,25°</span><button id="plus" aria-label="Vpravo o 0,25 stupňa">+</button></div>
      </div>
      <div class="control-section power">
        <div class="power-label"><label class="label" for="power">SILA ÚDERU</label><strong><span id="powerNumber">65</span>%</strong></div>
        <input id="power" type="range" min="2" max="100" value="65" step="1">
        <div class="ends"><span>JEMNE</span><span>NAPLNO</span></div>
      </div>
      <button id="shoot" class="shoot">↗ &nbsp; ÚDER <small>MEDZERNÍK</small></button>
    </section>
    <footer><span>SIMULÁCIA 240 Hz · 9 FT · WEB</span><span>VÝVOJOVÁ VERZIA — FALŠE A PRAVIDLÁ WPA EŠTE NIE SÚ HOTOVÉ</span></footer>
  </div>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
